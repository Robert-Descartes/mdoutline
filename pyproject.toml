[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mdoutline"
version = "0.1.0"
description = "Markdown chapters to a print-quality PDF with cover, TOC, page headers/footers and exact outline bookmarks"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["markdown", "pdf", "bookmarks", "outline", "chromium", "cjk"]
authors = [{ name = "mdoutline contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Printing",
]
dependencies = [
    "markdown>=3.5",
    "pymdown-extensions>=10.0",
    "pymupdf>=1.24",
    "playwright>=1.40",
]

[project.scripts]
mdoutline = "mdoutline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mdoutline"]
